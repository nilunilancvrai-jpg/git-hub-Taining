
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartWaste | Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">♻</div>
                <h1>SmartWaste</h1>
                <p>Smart Waste Management System</p>
            </div>

            <div class="login-heading">
                <h2>Welcome back</h2>
                <p>Sign in to continue to your account</p>
            </div>

            <button id="googleLoginBtn" class="google-btn">
                <img
                    src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                    alt="Google"
                >
                Continue with Google
            </button>

            <div class="separator">
                <span>OR CONTINUE WITH EMAIL</span>
            </div>

            <form id="loginForm">

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="form-options">
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn">
                    Sign In
                </button>

            </form>

            <p id="authMessage" role="status"></p>

            <div class="signup-section">
                Don't have an account?
                <button id="signupBtn" type="button">Create account</button>
            </div>

            <p class="security-note">
                Public accounts can register here. Worker accounts must be invited by a supervisor.
            </p>

        </section>

    </main>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase configuration -->
    <script src="js/supabaseClient.js"></script>

    <!-- Login functionality -->
    <script src="js/login.js"></script>

</body>
</html>
